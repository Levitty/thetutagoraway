name: Deploy edge function

# Deploys a Supabase edge function. Run it by hand from the Actions tab
# ("Run workflow") and pick the function.
#
# Why this exists: deploy.yml publishes dist/ to Hostinger and never touches
# supabase/functions, so an edge function only ever went live from somebody's
# laptop with the Supabase CLI logged in. That made mark-composition — the one
# place a child's writing is read, and now the one place a safeguarding
# disclosure is recorded — the hardest thing in the project to ship.
#
# ONE SECRET IS NEEDED, once:
#   SUPABASE_ACCESS_TOKEN   a personal access token from
#                           https://supabase.com/dashboard/account/tokens
#   Settings → Secrets and variables → Actions → New repository secret.
#
# This does NOT run database migrations. Adding DDL to a button is how a
# production schema gets changed by accident; run those in the SQL editor
# where you can see what you are about to do.

on:
  workflow_dispatch:
    inputs:
      function:
        description: Which function to deploy
        required: true
        # The default is whatever needs deploying next, because the dropdown
        # in GitHub's "Run workflow" panel does not always open — and when it
        # doesn't, the default is the only thing you can deploy.
        default: verify-subscription
        type: choice
        options:
          - verify-subscription
          - mark-composition
          - weekly-report
          - lesson-token
          - send-email
          - send-booking-email
          - send-lesson-reminders
          - send-push
          - verify-payment
          - verify-paystack

env:
  PROJECT_REF: dlqbiayaqjucxsvbesms

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The record step commits DEPLOYED.json. Without this the default token is
    # read-only and the push fails with exit 128 — AFTER a successful deploy,
    # which makes the whole run look like the deploy failed when it did not.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # mark-composition and weekly-report are GENERATED from a template plus a
      # module in src/. Rebuild and fail if the committed file differs: a hand
      # edit to the generated file would otherwise be silently deployed and
      # then silently lost on the next build. For mark-composition that file
      # carries the safeguarding screen, so the copy that protects a child must
      # be the copy the tests cover.
      - name: Regenerate and verify the generated function
        if: inputs.function == 'mark-composition' || inputs.function == 'weekly-report'
        run: |
          if [ "${{ inputs.function }}" = "mark-composition" ]; then
            npm run build:marking-fn
          else
            npm run build:report-fn
          fi
          if ! git diff --quiet -- "supabase/functions/${{ inputs.function }}/index.ts"; then
            echo "::error::supabase/functions/${{ inputs.function }}/index.ts is not what the build produces."
            echo "Someone edited the generated file by hand. Edit the template or the src/ module, rebuild, and commit."
            git --no-pager diff -- "supabase/functions/${{ inputs.function }}/index.ts"
            exit 1
          fi
          echo "Generated file matches the committed one."

      - name: Run the tests that cover it
        if: inputs.function == 'mark-composition'
        run: npm test

      - name: Set up the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          supabase functions deploy "${{ inputs.function }}" --project-ref "$PROJECT_REF"

      # Record WHAT was deployed, so scripts/function-drift.mjs can tell later
      # that the running copy is no longer this code. The seven-week gap
      # between the client and verify-subscription was invisible precisely
      # because nothing wrote this down.
      # Never fail the run over bookkeeping. The function is already deployed
      # by this point; a red tick here says "the deploy failed" to anyone
      # reading the Actions tab, which is worse than an unrecorded version —
      # the drift check will simply keep asking for this one.
      - name: Record the deployed version
        continue-on-error: true
        run: |
          node scripts/function-drift.mjs --record "${{ inputs.function }}"
          if git diff --quiet -- supabase/functions/DEPLOYED.json; then
            echo "Already recorded at this version."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/DEPLOYED.json
          git commit -m "Record ${{ inputs.function }} as deployed [skip ci]"
          # checkout leaves a detached HEAD, so the branch has to be named.
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Done
        run: echo "Deployed ${{ inputs.function }} to $PROJECT_REF."
